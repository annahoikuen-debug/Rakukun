version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rakukun}
    networks:
      - app-net
    volumes:
      - pgdata:/var/lib/postgresql/data

  gophish:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADMIN_LISTEN_URL: 0.0.0.0:3333
      # TLS is intentionally disabled: no certificate files are committed to the
      # repo, so enabling TLS would prevent gophish from starting. Generate
      # gophish_admin.crt / gophish_admin.key (and phish certs) before flipping
      # these back to "true".
      ADMIN_USE_TLS: "false"
      PHISH_LISTEN_URL: 0.0.0.0:80
      PHISH_USE_TLS: "false"
      DB_NAME: sqlite3
    networks:
      - app-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rakukun}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      GOPHISH_ADMIN_URL: http://gophish:3333
      GOPHISH_ADMIN_API_KEY: ${GOPHISH_ADMIN_API_KEY:?GOPHISH_ADMIN_API_KEY is required}
      GOPHISH_KEY_ENCRYPTION_SECRET: ${GOPHISH_KEY_ENCRYPTION_SECRET:?GOPHISH_KEY_ENCRYPTION_SECRET is required}
    networks:
      - app-net
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - gophish

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
